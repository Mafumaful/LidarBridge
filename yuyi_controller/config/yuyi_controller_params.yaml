yuyi_controller_node:
  ros__parameters:
    odom_topic: /fastlio2/lio_odom
    cmd_vel_topic: /cmd_vel
    path_topic: /yuyi_controller/reference_path
    target_marker_topic: /yuyi_controller/lookahead_target

    path_file: install/simulation/share/simulation/paths/generated_path.yaml

    controller_rate_hz: 20.0
    lookahead_time_sec: 1.5
    min_lookahead_distance_m: 0.6
    max_lookahead_distance_m: 2.0
    goal_tolerance_m: 0.2

    max_speed_mps: 0.8
    max_acceleration_mps2: 0.5
    max_deceleration_mps2: 0.8
    max_angular_speed_radps: 1.5

    stop_at_goal: true
